# Prometheus config for the LOCAL DEMO only. It scrapes the synthetic exporter
# (not a real GPU) under job name "dcgm-exporter" so the shipped rules and
# `gpuobs check-prometheus` behave exactly as they would against real DCGM.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/recording-rules.yaml
  - /etc/prometheus/rules/alert-rules.yaml

scrape_configs:
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["synthetic-exporter:9400"]
        labels:
          # Mimic the per-instance label a real scrape would attach.
          instance: "synthetic-exporter:9400"
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
