[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuobs"
version = "0.1.0"
description = "Validation tooling and a local demo for a GPU (DCGM/Prometheus/Grafana) observability stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "gpu-observability-stack contributors" }]
keywords = ["gpu", "dcgm", "prometheus", "grafana", "observability", "kubernetes"]

dependencies = [
    "typer>=0.12,<1.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
gpuobs = "gpuobs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpuobs = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/gpuobs/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
packages = ["gpuobs"]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
